[project]
name = "week02-meeting-room-agent"
version = "0.1.0"
description = "회의실 예약 서비스 + AI 에이전트 — 2주차 라이브 시연"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "litellm>=1.60",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
